<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <!-- 厚みさん アプリアイコン。assets/README の手順で PNG 化して @capacitor/assets に渡す -->
  <defs>
    <radialGradient id="cloth" cx="50%" cy="42%" r="75%">
      <stop offset="0" stop-color="#2f9460"/>
      <stop offset="1" stop-color="#14502f"/>
    </radialGradient>
    <radialGradient id="ob" cx="36%" cy="32%" r="75%">
      <stop offset="0" stop-color="#fff2a6"/>
      <stop offset="0.28" stop-color="#f7cc1c"/>
      <stop offset="0.8" stop-color="#c79a00"/>
      <stop offset="1" stop-color="#8a6a00"/>
    </radialGradient>
    <radialGradient id="shadow" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#000" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#000" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <g id="bg"><rect width="1024" height="1024" fill="url(#cloth)"/></g>
  <g id="fg">
    <!-- 手球→ゴーストのライン -->
    <line x1="349" y1="741" x2="268" y2="901" stroke="#fff" stroke-width="22" stroke-linecap="round" stroke-dasharray="26 30" opacity="0.92"/>
    <!-- 的球の影と的球 -->
    <ellipse cx="624" cy="438" rx="144" ry="132" fill="url(#shadow)"/>
    <circle cx="607.5" cy="416.5" r="135" fill="url(#ob)"/>
    <ellipse cx="566" cy="369" rx="38" ry="27" fill="#fff" opacity="0.75" transform="rotate(-35 566 369)"/>
    <!-- ゴーストボール -->
    <circle cx="416.5" cy="607.5" r="135" fill="#fff" fill-opacity="0.16" stroke="#fff" stroke-width="16" stroke-dasharray="34 24"/>
    <circle cx="416.5" cy="607.5" r="14" fill="#fff"/>
    <!-- 接点 -->
    <circle cx="512" cy="512" r="19" fill="#4fa8ff" stroke="#fff" stroke-width="6"/>
  </g>
</svg>
