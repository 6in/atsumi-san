name: Android debug build

on:
  push:
    paths: ['src/**', 'public/**', 'index.html', 'package*.json', 'vite.config.js', 'capacitor.config.json', 'android/**', '.github/workflows/android.yml']
  workflow_dispatch:

permissions:
  contents: write   # main では Releases に APK を置く

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: npm ci
      - run: npm run build
      - run: npx cap sync android
      - run: ./gradlew assembleDebug
        working-directory: android
      - uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
      # main の最新ビルドを Releases の「latest」に置き換える（スマホのブラウザから直接ダウンロードできる）
      - name: Publish to Releases
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk atsumi-san-debug.apk
          gh release delete latest --cleanup-tag --yes || true
          gh release create latest atsumi-san-debug.apk \
            --target "$GITHUB_SHA" --latest \
            --title "最新ビルド（debug）" \
            --notes "main の最新コミット（${GITHUB_SHA::7}）の debug 版 APK です。Android 端末でダウンロードしてインストールしてください（初回は「提供元不明のアプリ」の許可が必要）。"
